<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuantumTrade Easy Market Selector</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0b0e14',
                        cardBg: '#151921',
                        borderBg: '#222733',
                        accentGreen: '#00c076',
                        accentRed: '#ff3b30'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-darkBg text-gray-200 font-sans min-h-screen flex flex-col">

    <!-- Top Header -->
    <header class="bg-cardBg border-b border-borderBg px-6 py-3 flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <i class="fa-solid fa-chart-line text-2xl text-emerald-400"></i>
            <h1 class="text-xl font-bold tracking-wide text-white">Quantum<span class="text-emerald-400">Trade</span> Fast Engine</h1>
        </div>
        <div id="marketBadge" class="px-3 py-1 rounded-full text-xs font-bold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
            MARKET OPEN
        </div>
    </header>

    <!-- Main Container -->
    <main class="p-4 md:p-6 grid grid-cols-1 lg:grid-cols-4 gap-6 flex-grow">

        <!-- Left 3 Columns: Quick Market Selector + Live Chart -->
        <div class="lg:col-span-3 flex flex-col gap-4">
            
            <!-- Quick Search Bar & Popular Pair Buttons -->
            <div class="bg-cardBg border border-borderBg p-4 rounded-xl space-y-3">
                
                <!-- Search Bar -->
                <div class="relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-gray-400 text-sm"></i>
                    <input type="text" id="searchInput" onkeyup="filterMarkets()" placeholder="Type pair name (e.g. USD/CHF, BTC, Gold)..." class="w-full bg-darkBg border border-borderBg rounded-lg pl-9 pr-4 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
                </div>

                <!-- Popular Quick-Click Tiles -->
                <div class="flex flex-wrap gap-2 pt-1" id="quickTiles">
                    <!-- Dynamic Buttons Loaded by JS -->
                </div>
            </div>

            <!-- TradingView Live Chart Container -->
            <div class="bg-cardBg border border-borderBg p-2 rounded-xl h-[520px] relative overflow-hidden">
                <div id="tradingview_chart" class="w-full h-full"></div>
            </div>
        </div>

        <!-- Right Column: Signal Engine -->
        <div class="bg-cardBg border border-borderBg p-5 rounded-xl flex flex-col justify-between">
            <div>
                <h2 class="text-md font-bold text-white border-b border-borderBg pb-3 mb-4 flex items-center justify-between">
                    <span>1-Min Signal Engine</span>
                    <span class="text-xs bg-emerald-500/10 text-emerald-400 px-2 py-0.5 rounded border border-emerald-500/20">LIVE</span>
                </h2>

                <div id="signalCard" class="bg-darkBg border border-borderBg p-6 rounded-xl text-center mb-6">
                    <span class="text-xs text-gray-400 uppercase tracking-widest block mb-1">1-Min Prediction</span>
                    <span id="signalText" class="text-2xl font-black text-gray-400">ANALYZING...</span>
                    <span id="signalSubText" class="text-xs text-gray-500 block mt-2">Reading live price action</span>
                </div>

                <div class="space-y-3 text-sm">
                    <div class="flex justify-between items-center border-b border-borderBg pb-2">
                        <span class="text-gray-400">Active Market</span>
                        <span id="selectedMarketText" class="font-bold text-emerald-400">USD/CHF</span>
                    </div>
                    <div class="flex justify-between items-center border-b border-borderBg pb-2">
                        <span class="text-gray-400">Timeframe</span>
                        <span class="font-bold text-white">1 Minute (1m)</span>
                    </div>
                </div>
            </div>

            <div class="mt-6 pt-4 border-t border-borderBg text-[11px] text-gray-500 text-center">
                <i class="fa-solid fa-shield-halved mr-1 text-emerald-400"></i> Auto Closed Market Protection
            </div>
        </div>
    </main>

    <!-- TradingView Embed Script -->
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script>
        // Combined All Markets List
        const allMarkets = [
            // Forex
            { name: "USD/CHF", symbol: "FX:USDCHF", category: "Forex", is24x7: false },
            { name: "EUR/USD", symbol: "FX:EURUSD", category: "Forex", is24x7: false },
            { name: "GBP/USD", symbol: "FX:GBPUSD", category: "Forex", is24x7: false },
            { name: "USD/JPY", symbol: "FX:USDJPY", is24x7: false },
            { name: "AUD/USD", symbol: "FX:AUDUSD", category: "Forex", is24x7: false },
            { name: "GBP/JPY", symbol: "FX:GBPJPY", category: "Forex", is24x7: false },
            { name: "EUR/JPY", symbol: "FX:EURJPY", category: "Forex", is24x7: false },
            { name: "AUD/CAD", symbol: "FX:AUDCAD", category: "Forex", is24x7: false },
            { name: "CAD/CHF", symbol: "FX:CADCHF", category: "Forex", is24x7: false },
            
            // Crypto (24/7)
            { name: "BTC/USD", symbol: "BINANCE:BTCUSDT", category: "Crypto", is24x7: true },
            { name: "ETH/USD", symbol: "BINANCE:ETHUSDT", category: "Crypto", is24x7: true },
            { name: "SOL/USD", symbol: "BINANCE:SOLUSDT", category: "Crypto", is24x7: true },
            
            // Commodities
            { name: "Gold (XAU/USD)", symbol: "OANDA:XAUUSD", category: "Commodities", is24x7: false },
            { name: "Silver (XAG/USD)", symbol: "OANDA:XAGUSD", category: "Commodities", is24x7: false },
            { name: "Crude Oil", symbol: "TVC:USOIL", category: "Commodities", is24x7: false },

            // Stocks
            { name: "Apple", symbol: "NASDAQ:AAPL", category: "Stocks", is24x7: false },
            { name: "Tesla", symbol: "NASDAQ:TSLA", category: "Stocks", is24x7: false }
        ];

        let selectedMarket = allMarkets[0]; // Default USD/CHF

        function isMarketOpen(is24x7) {
            if (is24x7) return true;
            const day = new Date().getUTCDay();
            return !(day === 0 || day === 6);
        }

        // Render Quick Select Buttons
        function renderTiles(list) {
            const container = document.getElementById('quickTiles');
            container.innerHTML = '';

            list.forEach((item) => {
                const btn = document.createElement('button');
                const isSelected = item.name === selectedMarket.name;
                
                btn.className = `px-3 py-1.5 text-xs font-bold rounded-lg transition border ${
                    isSelected 
                        ? 'bg-emerald-500 text-darkBg border-emerald-400' 
                        : 'bg-darkBg text-gray-300 border-borderBg hover:border-emerald-500 hover:text-white'
                }`;
                btn.innerText = item.name;
                btn.onclick = () => selectPair(item);
                container.appendChild(btn);
            });
        }

        // Search Filter
        function filterMarkets() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allMarkets.filter(m => m.name.toLowerCase().includes(query));
            renderTiles(filtered);
        }

        // Select Pair Function
        function selectPair(market) {
            selectedMarket = market;
            renderTiles(allMarkets);

            document.getElementById('selectedMarketText').innerText = market.name;
            const isOpen = isMarketOpen(market.is24x7);

            const badge = document.getElementById('marketBadge');
            const signalText = document.getElementById('signalText');
            const signalSubText = document.getElementById('signalSubText');

            if (!isOpen) {
                badge.className = "px-3 py-1 rounded-full text-xs font-bold bg-red-500/20 text-red-400 border border-red-500/30 flex items-center gap-2";
                badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-red-400"></span> MARKET CLOSED`;
                
                signalText.innerText = "MARKET CLOSED";
                signalText.className = "text-xl font-black text-red-500";
                signalSubText.innerText = "Trading paused until market opens";
            } else {
                badge.className = "px-3 py-1 rounded-full text-xs font-bold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 flex items-center gap-2";
                badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> MARKET OPEN`;
                
                signalText.innerText = "ANALYZING...";
                signalText.className = "text-2xl font-black text-gray-400";
                signalSubText.innerText = "Awaiting 1-min candle close";
            }

            // Reload Live TradingView Chart
            new TradingView.widget({
                "autosize": true,
                "symbol": market.symbol,
                "interval": "1", // 1-Min Timeframe
                "timezone": "Etc/UTC",
                "theme": "dark",
                "style": "1",
                "locale": "en",
                "toolbar_bg": "#151921",
                "enable_publishing": false,
                "container_id": "tradingview_chart"
            });
        }

        window.onload = () => {
            renderTiles(allMarkets);
            selectPair(allMarkets[0]); // Open USD/CHF by default
        };
    </script>
</body>
</html>
