<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuantumTrade 1-Min Live Analysis</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0b0e14',
                        cardBg: '#151921',
                        borderBg: '#222733',
                        accentGreen: '#00c076',
                        accentRed: '#ff3b30'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-darkBg text-gray-200 font-sans min-h-screen flex flex-col">

    <!-- Header Navigation -->
    <header class="bg-cardBg border-b border-borderBg px-6 py-3 flex flex-wrap justify-between items-center gap-4">
        <div class="flex items-center space-x-3">
            <i class="fa-solid fa-chart-line text-2xl text-emerald-400"></i>
            <h1 class="text-xl font-bold tracking-wide text-white">Quantum<span class="text-emerald-400">Trade</span> Live Chart Pro</h1>
        </div>
        
        <!-- Market Status Badge -->
        <div id="marketBadge" class="px-3 py-1 rounded-full text-xs font-bold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
            MARKET OPEN
        </div>
    </header>

    <!-- Main Layout -->
    <main class="p-4 md:p-6 grid grid-cols-1 lg:grid-cols-4 gap-6 flex-grow">

        <!-- Left 3 Columns: Asset Selector & Live TradingView Chart -->
        <div class="lg:col-span-3 flex flex-col gap-4">
            
            <!-- Category Tabs & Dropdown Bar -->
            <div class="bg-cardBg border border-borderBg p-4 rounded-xl flex flex-wrap justify-between items-center gap-4">
                
                <!-- Category Tabs -->
                <div class="flex items-center space-x-2 bg-darkBg p-1 rounded-lg border border-borderBg flex-wrap gap-y-1">
                    <button onclick="setCategory('currencies')" id="tab-currencies" class="px-3 py-1.5 text-xs font-bold rounded-md bg-emerald-500 text-darkBg transition">
                        <i class="fa-solid fa-dollar-sign mr-1"></i> Forex
                    </button>
                    <button onclick="setCategory('crypto')" id="tab-crypto" class="px-3 py-1.5 text-xs font-bold rounded-md text-gray-400 hover:text-white transition">
                        <i class="fa-brands fa-bitcoin mr-1"></i> Crypto
                    </button>
                    <button onclick="setCategory('commodities')" id="tab-commodities" class="px-3 py-1.5 text-xs font-bold rounded-md text-gray-400 hover:text-white transition">
                        <i class="fa-solid fa-droplet mr-1"></i> Commodities
                    </button>
                    <button onclick="setCategory('stocks')" id="tab-stocks" class="px-3 py-1.5 text-xs font-bold rounded-md text-gray-400 hover:text-white transition">
                        <i class="fa-solid fa-file-lines mr-1"></i> Stocks
                    </button>
                </div>

                <!-- Asset Select Dropdown -->
                <div class="flex-grow max-w-xs">
                    <select id="assetSelect" onchange="loadSelectedAsset()" class="w-full bg-darkBg border border-borderBg rounded-lg px-3 py-2 text-sm font-semibold text-white focus:outline-none focus:border-emerald-500">
                    </select>
                </div>
            </div>

            <!-- TradingView Advanced Live Chart Embed Container -->
            <div class="bg-cardBg border border-borderBg p-2 rounded-xl h-[550px] relative overflow-hidden">
                <div id="tradingview_advanced_chart" class="w-full h-full"></div>
            </div>
        </div>

        <!-- Right Column: 1-Min Signal Engine -->
        <div class="bg-cardBg border border-borderBg p-5 rounded-xl flex flex-col justify-between">
            <div>
                <h2 class="text-md font-bold text-white border-b border-borderBg pb-3 mb-4 flex items-center justify-between">
                    <span>1-Min Signal Engine</span>
                    <span class="text-xs bg-emerald-500/10 text-emerald-400 px-2 py-0.5 rounded border border-emerald-500/20">LIVE</span>
                </h2>

                <!-- Main Prediction Box -->
                <div id="signalCard" class="bg-darkBg border border-borderBg p-6 rounded-xl text-center mb-6">
                    <span class="text-xs text-gray-400 uppercase tracking-widest block mb-1">1-Min Next Candle</span>
                    <span id="signalText" class="text-2xl font-black text-gray-400">ANALYZING...</span>
                    <span id="signalSubText" class="text-xs text-gray-500 block mt-2">Checking TradingView Chart data</span>
                </div>

                <!-- Market Details -->
                <div class="space-y-3 text-sm">
                    <div class="flex justify-between items-center border-b border-borderBg pb-2">
                        <span class="text-gray-400">Selected Market</span>
                        <span id="selectedMarketText" class="font-bold text-white">EUR/USD</span>
                    </div>
                    <div class="flex justify-between items-center border-b border-borderBg pb-2">
                        <span class="text-gray-400">Chart Timeframe</span>
                        <span class="font-bold text-emerald-400">1 Minute (1m)</span>
                    </div>
                    <div class="flex justify-between items-center border-b border-borderBg pb-2">
                        <span class="text-gray-400">Market Status</span>
                        <span id="tradingStatusText" class="font-bold text-emerald-400">Active</span>
                    </div>
                </div>
            </div>

            <div class="mt-6 pt-4 border-t border-borderBg text-[11px] text-gray-500 text-center">
                <i class="fa-solid fa-shield-halved mr-1 text-emerald-400"></i> Auto Closed Market Protection Active
            </div>
        </div>
    </main>

    <!-- TradingView Embed Script -->
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script>
        const assetDatabase = {
            currencies: [
                { name: "EUR/USD", tvSymbol: "FX:EURUSD", is24x7: false },
                { name: "GBP/USD", tvSymbol: "FX:GBPUSD", is24x7: false },
                { name: "USD/JPY", tvSymbol: "FX:USDJPY", is24x7: false },
                { name: "AUD/USD", tvSymbol: "FX:AUDUSD", is24x7: false },
                { name: "GBP/JPY", tvSymbol: "FX:GBPJPY", is24x7: false },
                { name: "EUR/JPY", tvSymbol: "FX:EURJPY", is24x7: false },
                { name: "AUD/CAD", tvSymbol: "FX:AUDCAD", is24x7: false },
                { name: "AUD/CHF", tvSymbol: "FX:AUDCHF", is24x7: false },
                { name: "AUD/JPY", tvSymbol: "FX:AUDJPY", is24x7: false },
                { name: "CAD/CHF", tvSymbol: "FX:CADCHF", is24x7: false },
                { name: "CHF/JPY", tvSymbol: "FX:CHFJPY", is24x7: false },
                { name: "EUR/AUD", tvSymbol: "FX:EURAUD", is24x7: false },
                { name: "EUR/CAD", tvSymbol: "FX:EURCAD", is24x7: false },
                { name: "EUR/CHF", tvSymbol: "FX:EURCHF", is24x7: false },
                { name: "EUR/GBP", tvSymbol: "FX:EURGBP", is24x7: false },
                { name: "GBP/AUD", tvSymbol: "FX:GBPAUD", is24x7: false },
                { name: "GBP/CAD", tvSymbol: "FX:GBPCAD", is24x7: false },
                { name: "GBP/CHF", tvSymbol: "FX:GBPCHF", is24x7: false },
                { name: "USD/CAD", tvSymbol: "FX:USDCAD", is24x7: false },
                { name: "USD/CHF", tvSymbol: "FX:USDCHF", is24x7: false }
            ],
            crypto: [
                { name: "Bitcoin (BTC/USD)", tvSymbol: "BINANCE:BTCUSDT", is24x7: true },
                { name: "Ethereum (ETH/USD)", tvSymbol: "BINANCE:ETHUSDT", is24x7: true },
                { name: "Solana (SOL/USD)", tvSymbol: "BINANCE:SOLUSDT", is24x7: true },
                { name: "Ripple (XRP/USD)", tvSymbol: "BINANCE:XRPUSDT", is24x7: true },
                { name: "Chainlink (LINK/USD)", tvSymbol: "BINANCE:LINKUSDT", is24x7: true }
            ],
            commodities: [
                { name: "Gold (XAU/USD)", tvSymbol: "OANDA:XAUUSD", is24x7: false },
                { name: "Silver (XAG/USD)", tvSymbol: "OANDA:XAGUSD", is24x7: false },
                { name: "Brent Oil", tvSymbol: "TVC:UKOIL", is24x7: false },
                { name: "WTI Crude Oil", tvSymbol: "TVC:USOIL", is24x7: false },
                { name: "Natural Gas", tvSymbol: "TVC:NATGAS", is24x7: false }
            ],
            stocks: [
                { name: "Apple (AAPL)", tvSymbol: "NASDAQ:AAPL", is24x7: false },
                { name: "Tesla (TSLA)", tvSymbol: "NASDAQ:TSLA", is24x7: false },
                { name: "Microsoft (MSFT)", tvSymbol: "NASDAQ:MSFT", is24x7: false },
                { name: "Meta / Facebook (META)", tvSymbol: "NASDAQ:META", is24x7: false },
                { name: "Boeing (BA)", tvSymbol: "NYSE:BA", is24x7: false },
                { name: "McDonald's (MCD)", tvSymbol: "NYSE:MCD", is24x7: false },
                { name: "Alibaba (BABA)", tvSymbol: "NYSE:BABA", is24x7: false }
            ]
        };

        let currentCategory = 'currencies';

        function isMarketOpen(is24x7) {
            if (is24x7) return true;
            const day = new Date().getUTCDay();
            return !(day === 0 || day === 6);
        }

        function setCategory(category) {
            currentCategory = category;
            
            ['currencies', 'crypto', 'commodities', 'stocks'].forEach(cat => {
                const btn = document.getElementById(`tab-${cat}`);
                if (cat === category) {
                    btn.className = "px-3 py-1.5 text-xs font-bold rounded-md bg-emerald-500 text-darkBg transition";
                } else {
                    btn.className = "px-3 py-1.5 text-xs font-bold rounded-md text-gray-400 hover:text-white transition";
                }
            });

            populateAssetDropdown();
        }

        function populateAssetDropdown() {
            const select = document.getElementById('assetSelect');
            select.innerHTML = '';

            assetDatabase[currentCategory].forEach((asset, index) => {
                const opt = document.createElement('option');
                opt.value = index;
                opt.innerText = asset.name;
                select.appendChild(opt);
            });

            loadSelectedAsset();
        }

        function loadSelectedAsset() {
            const index = document.getElementById('assetSelect').value || 0;
            const asset = assetDatabase[currentCategory][index];
            const isOpen = isMarketOpen(asset.is24x7);

            document.getElementById('selectedMarketText').innerText = asset.name;
            
            const badge = document.getElementById('marketBadge');
            const statusText = document.getElementById('tradingStatusText');
            const signalText = document.getElementById('signalText');
            const signalSubText = document.getElementById('signalSubText');

            if (!isOpen) {
                badge.className = "px-3 py-1 rounded-full text-xs font-bold bg-red-500/20 text-red-400 border border-red-500/30 flex items-center gap-2";
                badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-red-400"></span> MARKET CLOSED`;
                statusText.innerText = "Closed (Weekend)";
                statusText.className = "font-bold text-red-400";
                
                signalText.innerText = "MARKET CLOSED";
                signalText.className = "text-xl font-black text-red-500";
                signalSubText.innerText = "Trading paused until market opens";
            } else {
                badge.className = "px-3 py-1 rounded-full text-xs font-bold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 flex items-center gap-2";
                badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> MARKET OPEN`;
                statusText.innerText = "Active";
                statusText.className = "font-bold text-emerald-400";
                
                signalText.innerText = "ANALYZING...";
                signalText.className = "text-2xl font-black text-gray-400";
                signalSubText.innerText = "Awaiting 1-min candle close";
            }

            // Load Full-Featured TradingView Live Chart Widget
            new TradingView.widget({
                "autosize": true,
                "symbol": asset.tvSymbol,
                "interval": "1", // 1-Min Timeframe
                "timezone": "Etc/UTC",
                "theme": "dark",
                "style": "1", // Candlestick View
                "locale": "en",
                "toolbar_bg": "#151921",
                "enable_publishing": false,
                "allow_symbol_change": true,
                "hide_side_toolbar": false,
                "container_id": "tradingview_advanced_chart"
            });
        }

        window.onload = () => {
            setCategory('currencies');
        };
    </script>
</body>
</html>
