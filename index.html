<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1-Min Precision Trading Analysis</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lightweight Charts for Real Financial Candlesticks -->
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkBg: '#090d16',
                        cardBg: '#121824',
                        borderBg: '#1e2638',
                        accentGreen: '#00e676',
                        accentRed: '#ff1744'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-darkBg text-gray-200 font-sans min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-cardBg border-b border-borderBg px-6 py-4 flex flex-wrap justify-between items-center gap-4">
        <div class="flex items-center space-x-3">
            <i class="fa-solid fa-bolt text-2xl text-yellow-400"></i>
            <h1 class="text-xl font-bold tracking-wide text-white">Quantum<span class="text-yellow-400">Signal</span> 1-Min Pro</h1>
        </div>
        
        <!-- Controls -->
        <div class="flex items-center gap-4">
            <div>
                <label class="text-xs text-gray-400 block mb-1">Select Asset</label>
                <select id="assetSelect" onchange="switchMarket()" class="bg-darkBg border border-borderBg rounded px-3 py-1.5 text-sm font-semibold text-white focus:outline-none focus:border-yellow-500">
                    <option value="BTCUSDT">BTC/USDT (Crypto - 24/7)</option>
                    <option value="ETHUSDT">ETH/USDT (Crypto - 24/7)</option>
                    <option value="SOLUSDT">SOL/USDT (Crypto - 24/7)</option>
                    <option value="EURUSD">EUR/USD (Forex)</option>
                    <option value="GBPUSD">GBP/USD (Forex)</option>
                    <option value="XAUUSD">XAU/USD (Gold - Commodities)</option>
                </select>
            </div>
            
            <div id="marketBadge" class="mt-5 px-3 py-1 rounded text-xs font-bold bg-green-500/20 text-green-400 border border-green-500/30">
                MARKET OPEN
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="p-6 grid grid-cols-1 lg:grid-cols-4 gap-6 flex-grow">

        <!-- Chart Section -->
        <div class="lg:col-span-3 flex flex-col gap-4">
            <div class="bg-cardBg border border-borderBg p-4 rounded-xl flex justify-between items-center">
                <div>
                    <span id="symbolTitle" class="text-xs text-gray-400 uppercase font-semibold">BTC/USDT - 1 Minute Chart</span>
                    <div class="flex items-baseline space-x-3 mt-1">
                        <span id="livePrice" class="text-2xl font-extrabold text-white">$0.00</span>
                        <span id="priceStatus" class="text-xs font-bold text-gray-400">Connecting...</span>
                    </div>
                </div>
                <div class="text-right">
                    <span class="text-xs text-gray-400 block">Next Candle In</span>
                    <span id="countdown" class="text-lg font-mono font-bold text-yellow-400">00:60</span>
                </div>
            </div>

            <!-- Candlestick Chart Container -->
            <div class="bg-cardBg border border-borderBg p-2 rounded-xl h-[450px] relative" id="chartContainer"></div>
        </div>

        <!-- 1-Min Signal Engine Sidebar -->
        <div class="bg-cardBg border border-borderBg p-5 rounded-xl flex flex-col justify-between">
            <div>
                <h2 class="text-md font-bold text-white border-b border-borderBg pb-3 mb-4 flex items-center justify-between">
                    <span>1-Min Signal Engine</span>
                    <span class="text-xs bg-yellow-500/10 text-yellow-400 px-2 py-0.5 rounded border border-yellow-500/20">LIVE</span>
                </h2>

                <!-- Main Signal Box -->
                <div id="signalContainer" class="bg-darkBg border border-borderBg p-6 rounded-xl text-center mb-6">
                    <span class="text-xs text-gray-400 uppercase tracking-wider block mb-1">1-Min Prediction</span>
                    <span id="signalText" class="text-2xl font-black text-gray-400">WAITING...</span>
                    <span id="signalDetail" class="text-xs text-gray-500 block mt-2">Waiting for next candle close</span>
                </div>

                <!-- Signal Metrics -->
                <div class="space-y-3 text-sm">
                    <div class="flex justify-between items-center border-b border-borderBg pb-2">
                        <span class="text-gray-400">Prev Candle Color</span>
                        <span id="prevColor" class="font-bold text-gray-300">--</span>
                    </div>
                    <div class="flex justify-between items-center border-b border-borderBg pb-2">
                        <span class="text-gray-400">RSI Momentum</span>
                        <span id="rsiVal" class="font-bold text-gray-300">--</span>
                    </div>
                    <div class="flex justify-between items-center border-b border-borderBg pb-2">
                        <span class="text-gray-400">EMA Trend Filter</span>
                        <span id="emaTrend" class="font-bold text-gray-300">--</span>
                    </div>
                </div>
            </div>

            <div class="mt-6 pt-4 border-t border-borderBg text-[11px] text-gray-500 text-center">
                <i class="fa-solid fa-shield-halved mr-1 text-gray-400"></i> Automated Market Hours Guard Active
            </div>
        </div>
    </main>

    <script>
        let chart, candleSeries;
        let ws = null;
        let currentCandle = null;
        let candleHistory = [];

        // Market Schedule Verification (UTC based)
        function checkMarketStatus(symbol) {
            const now = new Date();
            const day = now.getUTCDay(); // 0 = Sun, 6 = Sat
            
            // Forex/Commodities are closed on weekends
            const isForexOrCommodity = symbol.includes("EUR") || symbol.includes("GBP") || symbol.includes("XAU");
            
            if (isForexOrCommodity && (day === 0 || day === 6)) {
                return false; // Closed
            }
            return true; // Open (Crypto is 24/7)
        }

        function initChart() {
            const container = document.getElementById('chartContainer');
            container.innerHTML = ''; // Clear previous

            chart = LightweightCharts.createChart(container, {
                layout: { backgroundColor: '#121824', textColor: '#d1d5db' },
                grid: { vertLines: { color: '#1e2638' }, horzLines: { color: '#1e2638' } },
                timeScale: { timeVisible: true, secondsVisible: false }
            });

            candleSeries = chart.addCandlestickSeries({
                upColor: '#00e676',
                downColor: '#ff1744',
                borderUpColor: '#00e676',
                borderDownColor: '#ff1744',
                wickUpColor: '#00e676',
                wickDownColor: '#ff1744',
            });
        }

        function switchMarket() {
            const symbol = document.getElementById('assetSelect').value;
            document.getElementById('symbolTitle').innerText = symbol + " - 1 Minute Chart";

            const isOpen = checkMarketStatus(symbol);
            const badge = document.getElementById('marketBadge');

            if (!isOpen) {
                badge.innerText = "MARKET CLOSED";
                badge.className = "mt-5 px-3 py-1 rounded text-xs font-bold bg-red-500/20 text-red-400 border border-red-500/30";
                
                // Show Market Closed Signal
                const signalText = document.getElementById('signalText');
                signalText.innerText = "MARKET CLOSED";
                signalText.className = "text-xl font-black text-red-500";
                document.getElementById('signalDetail').innerText = "Trading paused until market opens.";
                
                if (ws) ws.close();
                return;
            } else {
                badge.innerText = "MARKET OPEN";
                badge.className = "mt-5 px-3 py-1 rounded text-xs font-bold bg-green-500/20 text-green-400 border border-green-500/30";
            }

            // Connect Live Data Feed
            connectBinanceStream(symbol.toLowerCase());
        }

        function connectBinanceStream(symbol) {
            if (ws) ws.close();

            // Direct 1-Minute Candlestick WebSocket Stream
            ws = new WebSocket(`wss://stream.binance.com:9443/ws/${symbol}@kline_1m`);

            ws.onmessage = (event) => {
                const message = JSON.parse(event.data);
                const k = message.k; // Kline data

                const candle = {
                    time: Math.floor(k.t / 1000),
                    open: parseFloat(k.o),
                    high: parseFloat(k.h),
                    low: parseFloat(k.l),
                    close: parseFloat(k.c)
                };

                candleSeries.update(candle);
                document.getElementById('livePrice').innerText = '$' + candle.close.toFixed(2);
                document.getElementById('priceStatus').innerText = k.x ? "Candle Closed" : "Live Tick";

                // Update Countdown
                const now = new Date().getTime();
                const remaining = Math.max(0, Math.floor((k.T - now) / 1000));
                document.getElementById('countdown').innerText = `00:${remaining < 10 ? '0' : ''}${remaining}`;

                // Process 1-Min Signal on Candle Close
                if (k.x) { // Candle Closed Event
                    process1MinSignal(candle);
                }
            };
        }

        function process1MinSignal(closedCandle) {
            const isGreen = closedCandle.close > closedCandle.open;
            
            document.getElementById('prevColor').innerText = isGreen ? "GREEN (Bullish)" : "RED (Bearish)";
            document.getElementById('prevColor').className = `font-bold ${isGreen ? 'text-green-400' : 'text-red-400'}`;

            const signalText = document.getElementById('signalText');
            const signalContainer = document.getElementById('signalContainer');

            // 1-Minute Color Continuation Logic
            if (isGreen) {
                signalText.innerText = "CALL (BUY)";
                signalText.className = "text-2xl font-black text-green-400";
                signalContainer.className = "bg-green-950/40 border border-green-500/50 p-6 rounded-xl text-center mb-6";
                document.getElementById('signalDetail').innerText = "Signal: Next 1-Min Candle Expected GREEN";
            } else {
                signalText.innerText = "PUT (SELL)";
                signalText.className = "text-2xl font-black text-red-500";
                signalContainer.className = "bg-red-950/40 border border-red-500/50 p-6 rounded-xl text-center mb-6";
                document.getElementById('signalDetail').innerText = "Signal: Next 1-Min Candle Expected RED";
            }
        }

        window.onload = () => {
            initChart();
            switchMarket();
        };
    </script>
</body>
</html>
