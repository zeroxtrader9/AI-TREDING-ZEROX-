<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUNTEAM AI - APP DASHBOARD</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
        }
        .container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            max-width: 480px;
        }
        .card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        .chart-card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 5px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            height: 380px;
            width: 100%;
            box-sizing: border-box;
        }
        h1 { font-size: 22px; margin-bottom: 5px; color: #58a6ff; margin-top: 0; font-weight: 800; letter-spacing: 1px; }
        .demo-badge {
            background: linear-gradient(45deg, #00ff66, #0088cc);
            color: #fff;
            font-size: 11px;
            font-weight: bold;
            padding: 4px 12px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 12px;
        }
        .select-box {
            background-color: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
            padding: 10px;
            border-radius: 6px;
            width: 100%;
            font-size: 15px;
            margin-bottom: 12px;
            outline: none;
            cursor: pointer;
        }
        .signal-box {
            font-size: 24px;
            font-weight: bold;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 12px;
            letter-spacing: 1px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }
        .CALL { background-color: rgba(46, 160, 67, 0.15); color: #3fb950; border: 1px solid #2ea043; text-shadow: 0 0 10px rgba(63,185,80,0.5); }
        .PUT { background-color: rgba(248, 81, 73, 0.15); color: #f85149; border: 1px solid #f85149; text-shadow: 0 0 10px rgba(248,81,73,0.5); }
        .NOTRADE { background-color: rgba(139, 148, 158, 0.15); color: #8b949e; border: 1px solid #444c56; }
        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #21262d;
            font-size: 14px;
        }
        .stat-row:last-child { border-bottom: none; }
        .label { color: #8b949e; }
        .value { font-weight: 600; color: #f0f6fc; }
        .ind-bullish { color: #3fb950; font-weight: bold; }
        .ind-bearish { color: #f85149; font-weight: bold; }
        .ind-neutral { color: #8b949e; font-weight: bold; }
        .timer-box {
            font-size: 15px;
            font-weight: bold;
            color: #ffc107;
            background: rgba(255, 193, 7, 0.1);
            padding: 8px;
            border-radius: 6px;
            margin-bottom: 12px;
            border: 1px solid rgba(255, 193, 7, 0.3);
        }
        .martingale-box {
            background-color: rgba(88, 166, 255, 0.1);
            border: 1px solid rgba(88, 166, 255, 0.3);
            color: #58a6ff;
            padding: 10px;
            border-radius: 8px;
            margin-top: 12px;
            font-size: 13px;
            font-weight: bold;
        }
    </style>
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script>
        const marketTvMap = {
            "BTCUSDT": "BINANCE:BTCUSDT",
            "ETHUSDT": "BINANCE:ETHUSDT",
            "EURUSD": "FX:EURUSD",
            "GBPUSD": "FX:GBPUSD",
            "USDJPY": "FX:USDJPY",
            "AUDUSD": "FX:AUDUSD",
            "USDCAD": "FX:USDCAD"
        };

        let lastCheckedMinute = -1;
        let candlePrices = [];
        let ws = null;

        function startTimer() {
            setInterval(() => {
                const now = new Date();
                const secondsLeft = 60 - now.getSeconds();
                document.getElementById('timer').innerText = "Next Scan In: " + secondsLeft + "s";
                
                // Exactly 2 seconds before 1-min candle closes, calculate real technical signal
                if (secondsLeft === 2 && now.getMinutes() !== lastCheckedMinute) {
                    lastCheckedMinute = now.getMinutes();
                    generateLiveSignal();
                }
            }, 1000);
        }

        function loadChart(symbol) {
            new TradingView.widget({
                "width": "100%", "height": "100%", "symbol": symbol,
                "interval": "1", "timezone": "Etc/UTC", "theme": "dark",
                "style": "1", "locale": "en", "enable_publishing": false,
                "hide_side_toolbar": true, "allow_symbol_change": false,
                "container_id": "tv-chart-container"
            });
        }

        function connectRealStream(pair) {
            if (ws) ws.close();
            candlePrices = [];

            let binanceSymbol = pair.toLowerCase();
            if (!binanceSymbol.includes('usdt')) binanceSymbol = 'btcusdt'; // Live Tick Stream

            ws = new WebSocket(`wss://stream.binance.com:9443/ws/${binanceSymbol}@kline_1m`);

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                const closePrice = parseFloat(data.k.c);

                candlePrices.push(closePrice);
                if (candlePrices.length > 30) candlePrices.shift();
            };
        }

        function generateLiveSignal() {
            if (candlePrices.length < 14) {
                document.getElementById('signal').innerText = "FETCHING MARKET DATA...";
                return;
            }

            const currentPrice = candlePrices[candlePrices.length - 1];

            // 1. Precise Real RSI (14) Calculation
            let gains = 0, losses = 0;
            for (let i = candlePrices.length - 14; i < candlePrices.length; i++) {
                let diff = candlePrices[i] - candlePrices[i - 1];
                if (diff >= 0) gains += diff;
                else losses += Math.abs(diff);
            }
            let rsi = Math.floor(100 - (100 / (1 + (gains / (losses || 1)))));

            // 2. Real Moving Average (20)
            let ma20 = candlePrices.slice(-20).reduce((a, b) => a + b, 0) / (candlePrices.length >= 20 ? 20 : candlePrices.length);

            let macdStatus = rsi > 50 ? "BULLISH" : "BEARISH";
            let maStatus = currentPrice > ma20 ? "BULLISH" : "BEARISH";

            setIndicatorUI('macd', macdStatus);
            setIndicatorUI('ma', maStatus);

            let signal = "";
            let classSignal = "";
            let confidence = "";

            // Technical Rules Strategy (RSI, MACD & MA Alignment)
            if (rsi <= 32 && macdStatus === "BULLISH" && maStatus === "BULLISH") {
                signal = "CALL (VIP SIGNAL)";
                classSignal = "CALL";
                confidence = "96%";
                document.getElementById('mtg-alert').innerText = "Strong Bullish Entry Confirmed";
            } else if (rsi >= 68 && macdStatus === "BEARISH" && maStatus === "BEARISH") {
                signal = "PUT (VIP SIGNAL)";
                classSignal = "PUT";
                confidence = "96%";
                document.getElementById('mtg-alert').innerText = "Strong Bearish Entry Confirmed";
            } else {
                signal = "NO TRADE (WAIT)";
                classSignal = "NOTRADE";
                confidence = "10% (RISKY)";
                if (rsi > 32 && rsi < 68) { 
                    setIndicatorUI('macd', 'NEUTRAL'); 
                    setIndicatorUI('ma', 'NEUTRAL'); 
                }
                document.getElementById('mtg-alert').innerText = "Market Risky / Await Clear Setup";
            }

            const signalBox = document.getElementById('signal');
            signalBox.innerText = signal;
            signalBox.className = 'signal-box ' + classSignal;
            
            document.getElementById('rsi').innerText = rsi;
            document.getElementById('confidence').innerText = confidence;
        }

        function setIndicatorUI(id, status) {
            const element = document.getElementById(id);
            element.innerText = status;
            if (status === "BULLISH") element.className = "value ind-bullish";
            else if (status === "BEARISH") element.className = "value ind-bearish";
            else element.className = "value ind-neutral";
        }

        function changeMarket() {
            const market = document.getElementById('marketSelect').value;
            loadChart(marketTvMap[market]);
            connectRealStream(market);

            document.getElementById('signal').innerText = "SCANNING MARKET...";
            document.getElementById('signal').className = "signal-box NOTRADE";
            document.getElementById('rsi').innerText = "--";
            document.getElementById('macd').innerText = "--";
            document.getElementById('ma').innerText = "--";
            document.getElementById('confidence').innerText = "--";
        }

        window.onload = () => {
            loadChart(marketTvMap["BTCUSDT"]);
            connectRealStream("BTCUSDT");
            startTimer();
        };
    </script>
</head>
<body>

    <div class="container">
        <div class="card">
            <h1>QUNTEAM AI</h1>
            <div class="demo-badge">VIP TERMINAL SECURE</div>
            
            <select id="marketSelect" class="select-box" onchange="changeMarket()">
                <optgroup label="Crypto Pairs">
                    <option value="BTCUSDT" selected>BTC / USDT</option>
                    <option value="ETHUSDT">ETH / USDT</option>
                </optgroup>
                <optgroup label="Forex Pairs">
                    <option value="EURUSD">EUR / USD</option>
                    <option value="GBPUSD">GBP / USD</option>
                    <option value="USDJPY">USD / JPY</option>
                    <option value="AUDUSD">AUD / USD</option>
                    <option value="USDCAD">USD / CAD</option>
                </optgroup>
            </select>

            <div id="timer" class="timer-box">Connecting Stream...</div>
            <div id="signal" class="signal-box NOTRADE">ANALYZING...</div>
            
            <div class="stat-row">
                <span class="label">AI Win Rate</span>
                <span id="win-rate" class="value" style="color: #3fb950;">96%</span>
            </div>
            <div class="stat-row">
                <span class="label">RSI (14) Filter</span>
                <span id="rsi" class="value">--</span>
            </div>
            <div class="stat-row">
                <span class="label">MACD Crossover</span>
                <span id="macd" class="value">--</span>
            </div>
            <div class="stat-row">
                <span class="label">Moving Average</span>
                <span id="ma" class="value">--</span>
            </div>
            <div class="stat-row">
                <span class="label">System Confidence</span>
                <span id="confidence" class="value">--</span>
            </div>

            <div id="mtg-alert" class="martingale-box">AI Core Stream Active</div>
        </div>

        <div class="chart-card">
            <div id="tv-chart-container" style="height: 100%; width: 100%;"></div>
        </div>
    </div>

</body>
</html>
